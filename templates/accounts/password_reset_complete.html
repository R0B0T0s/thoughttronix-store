{% extends "base.html" %}

{% block title %}Password reset — The ThoughtTronix Store{% endblock %}

{% block content %}
  <div class="card mx-auto max-w-md bg-base-100 shadow-md">
    <div class="card-body">
      <h1 class="card-title text-2xl">Your password has been reset</h1>
      <p>You can now sign in with your new password.</p>
      <div class="card-actions mt-2 justify-end">
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign in</a>
      </div>
    </div>
  </div>
{% endblock %}
